    font-weight: 700;

    font-size: clamp(1.9rem, 9vw, 2.6rem);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .blurb {
    margin: 0.6rem 0 0;
    color: var(--muted);
    max-width: 34em;
  }

  .clock {
    --state: var(--ok);
    border-top: 1px solid var(--line);
    padding-top: 1.1rem;
  }
  .clock[data-state="soon"] {
    --state: var(--soon);
  }
  .clock[data-state="go"] {
    --state: var(--go);
  }
  .cap {
    margin: 0;
    font-size: 0.82rem;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--state);

  .big {
    margin: 0.1rem 0 0.2rem;
    font-size: clamp(4.6rem, 27vw, 8rem);

    font-weight: 600;

    font-size: 0.92rem;

  .mode {
    margin: 0.7rem 0 0;
    font-size: 0.92rem;
    font-weight: 650;

    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    min-height: 3.6rem;

    font-size: 1.05rem;
    font-weight: 650;

    width: 1.15rem;
    height: 1.15rem;

  }

    outline: 3px solid var(--ok);
    outline-offset: 3px;
  }
  .test {
    margin: 0;
    font-size: 0.72rem;
    color: var(--go);
    text-align: center;
  }
</style>

        { t: "13:15", end: "14:45", walk: 1, n: "Новая национальная галерея", ll: [52.5067, 13.3676], q: "Neue Nationalgalerie, Potsdamer Straße 50, Berlin",
          b: "Мис ван дер Роэ: стальной портик и стеклянный зал, реставрация Чипперфилда. Коллекция €14. Выход не позднее 14:45." },
        { t: "15:05", end: "15:45", go: "14:45", n: "Отель — забрать багаж", ll: HOTEL, q: HOTEL_Q,
          b: "Багаж на ресепшене." },
        { t: "17:00", end: "20:20", go: "15:45", hard: 1, zone: "ABC", n: "BER, терминал 1", ll: BER, q: BER_Q,
          b: "Нужна зона C. Регистрация Bluebird только на стойке. Повербанк и ценное — в личной вещи: ручную кладь могут сдать в багаж." },
        { t: "20:20", wait: 1, n: "Вылет BZ271", ll: BER, q: BER_Q,
          b: "Стойка Bluebird и контроль в терминале 1. Вылет в 20:20; прилёт в Тель-Авив 04.10 в 01:40 по времени Израиля." },
      ],
      "10-04": [
        { t: "01:40", wait: 1, il: 1, n: "Прилёт в Тель-Авив", ll: TLV, q: TLV_Q,
          b: "Рейс BZ271. Время израильское; расписание ночного поезда из аэропорта проверь накануне вылета." },
      ],
    };

    /* Летнее время до 25.10.2026: Берлин UTC+2, Израиль UTC+3 (точки с il). */
    var TZ = 2 * 3600e3,
      TZ_IL = 3 * 3600e3,
      MIN = 60e3;

    function at(d, t, il) {
      return Date.parse("2026-" + d + "T" + t + ":00" + (il ? "+03:00" : "+02:00"));
    }
    function hm(ms, il) {
      return new Date(ms + (il ? TZ_IL : TZ)).toISOString().slice(11, 16);
    }
    function dayOf(ms, il) {
      return new Date(ms + (il ? TZ_IL : TZ)).toISOString().slice(5, 10);
    }

    var STOPS = [];
    Object.keys(PLAN).forEach(function (d) {
      var prev = null;
      PLAN[d].forEach(function (s) {
        s.d = d;
        s.at = at(d, s.t, s.il);
        s.endAt = s.end ? at(d, s.end, s.il) : null;
        s.goAt = s.go ? at(d, s.go, s.il) : prev && prev.endAt;
        s.prev = prev;
        STOPS.push(s);
        prev = s;
      });
    });

    function dur(ms) {
      var m = Math.ceil(ms / MIN);
      if (m < 60) return [m, "мин"];
      if (m < 10 * 60) {
        var r = m % 60;
        return [Math.floor(m / 60) + ":" + (r < 10 ? "0" : "") + r, "ч"];
      }
      if (m < 24 * 60) return [Math.round(m / 60), "ч"];
      return [Math.floor(m / 1440), "дн"];
    }

    var $ = function (id) {
      return document.getElementById(id);
    };
    var el = {
      il: $("il"), ber: $("ber"), now: $("now"), when: $("when"), at: $("at"), fix: $("fix"),
      name: $("name"), blurb: $("blurb"), clock: $("clock"), cap: $("cap"),
      big: $("big"), plan: $("plan"), mode: $("mode"), go: $("go"), goLabel: $("goLabel"), test: $("test"),
    };
    /* Пишем в DOM, только если значение изменилось. */
    var shown = {};
    function put(key, node, value, prop) {
      if (shown[key] === value) return;
      shown[key] = value;
      node[prop || "textContent"] = value;
    }
    function show(node, on) {
      if (node.hidden === on) node.hidden = !on;
    }

    /* Сдвиг часов для проверки: #0930-1230 → 30.09 12:30 по Берлину. */
    var shift = 0;
    var m = /^#(\d\d)(\d\d)-(\d\d)(\d\d)$/.exec(location.hash);
    if (m) {
      shift = at(m[1] + "-" + m[2], m[3] + ":" + m[4]) - Date.now();
      show(el.test, true);
    }
    function now() {
      return Date.now() + shift;
    }

    function render() {
      var t = now(),
        i = 0;
      while (i < STOPS.length && STOPS[i].at <= t) i++;
      if (shift) put("test", el.test, "проверка: " + dayOf(t).split("-").reverse().join(".") + " " + hm(t));
      put("il", el.il, hm(t, 1));
      put("ber", el.ber, hm(t));

      if (i === STOPS.length) {
        put("name", el.name, "Поездка окончена");
        put("blurb", el.blurb, "BZ271: прилёт в Тель-Авив 04.10 в 01:40 по времени Израиля.");
        put("when", el.when, "");
        put("at", el.at, "");
        show(el.fix, false);
        show(el.now, false);
        show(el.clock, false);
        show(el.mode, false);
        show(el.go, false);
        return;
      }

      var s = STOPS[i],
        cur = s.prev;
      var inCur = cur && cur.endAt && t < cur.endAt;
      show(el.now, !!inCur);
      if (inCur) put("now", el.now, "по плану: " + cur.n + (cur.slot ? " · " + cur.slot : "") + " · до " + cur.end);

      var d = dayOf(t, s.il),
        label =
          s.d === d ? "дальше" : s.d === dayOf(t + 864e5, s.il) ? "завтра" : DAYS[s.d];
      put("when", el.when, label);
      put("at", el.at, s.t + (s.il ? " по Израилю" : ""));
      show(el.fix, !!s.hard);
      put("name", el.name, s.n);
      put("blurb", el.blurb, s.b);

      var leave = s.wait ? s.at : s.goAt;

      var left = leave - t,
        state,
        cap,
        big;
      if (s.wait) {
        big = dur(s.at - t);
        cap = "осталось";
        state = s.at - t > 15 * MIN ? "ok" : "soon";
        put("plan", el.plan, s.t + " · " + (s.d === d ? "сегодня" : DAYS[s.d]));
      } else if (left > 0) {
        big = dur(left);
        cap = "до выхода";
        state = left > 15 * MIN ? "ok" : "soon";
        /* Соседние точки (слот в index.html включает переход): «выход 12:30 → там к 12:30» не пишем. */
        put("plan", el.plan, "выход " + hm(leave, s.il) + (leave < s.at ? " → там к " + s.t : ""));
      } else {
        big = dur(s.at - t);
        cap = "выходи — там через";
        state = "go";
        put("plan", el.plan, "выход был в " + hm(leave, s.il) + (leave < s.at ? " · там к " + s.t : ""));
      }
      show(el.clock, true);
      if (el.clock.dataset.state !== state) el.clock.dataset.state = state;
      put("cap", el.cap, cap);
      put("big", el.big, big[0] + "<small>&nbsp;" + big[1] + "</small>", "innerHTML");

      /* Если переход входит во время текущего этапа, не переключаем карту раньше его конца. */
      var routeStop = inCur && cur.goAt === cur.at ? cur : s;
      show(el.mode, !s.wait);
      if (!s.wait) {
        put("mode", el.mode, routeStop === s ?
          (s.drive ? "Такси или машина" : s.walk ? "Можно пешком" :
          "Для графика нужен общественный транспорт" + (s.zone ? " · зона " + s.zone : "")) :
          "Текущая точка, пешком: " + routeStop.n);
      }
      show(el.go, !s.wait);
      if (s.wait) return;
      put("goLabel", el.goLabel, routeStop === s ? "Маршрут к следующей точке" : "Маршрут: " + routeStop.n);
      put(
        "href",
        el.go,
        "https://www.google.com/maps/dir/?api=1&destination=" +
          encodeURIComponent(routeStop.q) + "&travelmode=" + (routeStop.drive ? "driving" : routeStop.walk ? "walking" : "transit"),
        "href"
      );
    }

    var timer = 0;
    function tick() {
      clearTimeout(timer);
      render();
      timer = setTimeout(tick, MIN - (now() % MIN) + 50);
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return clearTimeout(timer);
      tick();
    });
    /* Возврат из bfcache: таймер мог быть снят, а visibilitychange не прийти. */
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) tick();
    });
    tick();
  })();
</script>
