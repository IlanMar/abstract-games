<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#161b1c" />
    <title>Карама — Дюна</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #161b1c;
        --surface: #222a2b;
        --line: #394445;
        --text: #f4f1e8;
        --muted: #a9b4b1;
        --sand: #e9c58c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      button {
        font: inherit;
      }
      .wrap {
        width: min(100%, 720px);
        margin: auto;
        padding: 24px 18px calc(32px + env(safe-area-inset-bottom));
      }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--sand);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 38px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }
      .intro {
        margin: 10px 0 0;
        color: var(--muted);
        max-width: 48ch;
      }
      .group-title {
        margin: 30px 0 12px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .faction {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 74px;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .faction:focus-visible {
        outline: 2px solid var(--sand);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        .faction:hover,
        .back:hover {
          border-color: var(--sand);
        }
      }
      .faction:active {
        transform: scale(0.985);
      }
      .mark.mark--image { border: 0; overflow: hidden; }
      .mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .mark {
        display: grid;
        place-items: center;
        flex: none;
        width: 39px;
        height: 39px;
        border: 2px solid currentColor;
        border-radius: 50%;
        color: var(--accent);
        font-size: 18px;
        font-weight: 750;
        line-height: 1;
      }
      .name {
        display: block;
        font-weight: 650;
        font-size: 15px;
        line-height: 1.18;
      }
      .subname {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }
      .note {
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .detail {
        display: none;
        touch-action: pan-y;
      }
      body.has-selection .home {
        display: none;
      }
      body.has-selection .detail {
        display: block;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: -8px 0 24px;
      }
      .back {
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .back:focus-visible {
        outline: 2px solid var(--sand);
        outline-offset: 3px;
      }
      .topbar-label {
        color: var(--muted);
        font-size: 14px;
      }
      .detail-heading {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
      }
      .detail-heading .mark {
        width: 54px;
        height: 54px;
        font-size: 23px;
      }
      .detail-heading .subname {
        font-size: 14px;
      }
      h2 {
        margin: 0;
        font-size: clamp(26px, 7vw, 36px);
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 18px;
        line-height: 1.25;
      }
      .section {
        margin-top: 20px;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
      }
      .list li {
        display: grid;
        grid-template-columns: minmax(84px, 30%) 1fr;
        gap: 12px;
        padding: 14px;
        border-top: 1px solid var(--line);
      }
      .list li:first-child {
        border-top: 0;
      }
      .term {
        color: var(--sand);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
      }
      .meaning {
        font-size: 15px;
        line-height: 1.4;
      }
      .power {
        padding: 18px;
        border: 1px solid #7b6444;
        border-radius: 16px;
        background: #332b22;
      }
      .power p {
        margin: 0;
        font-size: 16px;
      }
      .none {
        color: var(--muted);
      }
      .source {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 360px) {
        .grid {
          gap: 8px;
        }
        .faction {
          padding: 10px;
          gap: 8px;
        }
        .mark {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
        .list li {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>

        <div id="groups"></div>
        <p class="note">
          Эффекты приведены по памятке Karama List, включая фракции из дополнений.
        </p>
      </section>
      <article class="detail" id="detail" aria-live="polite"></article>
    </main>

      };
      const escapeHTML = (text) =>
        String(text).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      const mark = (faction) => iconImages[faction.id]
        ? `<span class="mark mark--image" aria-hidden="true"><img src="${iconImages[faction.id]}" alt=""></span>`
        : `<span class="mark" style="--accent:${faction.color}" aria-hidden="true">${escapeHTML(faction.glyph)}</span>`;
      document.getElementById("groups").innerHTML = groups
        .map(
          ([id, title]) =>
            `<h2 class="group-title">${title}</h2><div class="grid">${factions
              .filter((f) => f.group === id)
              .map(
                (f) =>
                  `<button class="faction" type="button" data-id="${f.id}">${mark(f)}<span><span class="name">${escapeHTML(f.name)}</span><span class="subname">${escapeHTML(f.en)}</span></span></button>`,
              )
              .join("")}</div>`,
        )
        .join("");

      function render() {
        const id = location.hash.slice(1);
        const faction = factions.find((f) => f.id === id);
        document.body.classList.toggle("has-selection", Boolean(faction));
        if (!faction) {
          document.title = "Карама — Дюна";
          window.scrollTo(0, 0);
          return;
        }
        document.title = `${faction.name} — Карама`;
        document.getElementById("detail").innerHTML = `
        <div class="topbar"><button class="back" type="button" id="back">← Фракции</button><span class="topbar-label">Памятка «Карама»</span></div>
        <header class="detail-heading">${mark(faction)}<div><h2>${escapeHTML(faction.name)}</h2><span class="subname">${escapeHTML(faction.en)}</span></div></header>
        <section class="section" aria-labelledby="stop-title"><h3 id="stop-title">Что можно остановить</h3><ul class="list">${faction.stop.map(([term, meaning]) => `<li><span class="term">${escapeHTML(term)}</span><span class="meaning">${escapeHTML(meaning)}</span></li>`).join("")}</ul></section>
        <section class="section power" aria-labelledby="power-title"><h3 id="power-title">Особая способность «Карамы»</h3><p class="${faction.power ? "" : "none"}">${escapeHTML(faction.power || "У этой фракции нет особой способности.")}</p></section>
        <p class="source">По памятке Karama List. Для спорных случаев используйте правила соответствующего дополнения.</p>`;
        document.getElementById("back").addEventListener("click", showHome);
        window.scrollTo(0, 0);
      }
      function showHome() {
        location.hash = "";
        render();
      }
      document.getElementById("groups").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-id]");
        if (!button) return;
        location.hash = button.dataset.id;
        render();
      });
      let touchStart = null;
      const detail = document.getElementById("detail");
      detail.addEventListener("touchstart", (event) => {
        touchStart = event.touches.length === 1
          ? { x: event.touches[0].clientX, y: event.touches[0].clientY }
          : null;
      }, { passive: true });
      detail.addEventListener("touchend", (event) => {
        if (!touchStart || event.changedTouches.length !== 1) return;
        const dx = event.changedTouches[0].clientX - touchStart.x;
        const dy = event.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) showHome();
      }, { passive: true });
      detail.addEventListener("touchcancel", () => { touchStart = null; });
      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
