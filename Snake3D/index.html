<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Snakes 3D</title>
  <link rel="stylesheet" href="style.css?v=25">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Snakes 3D"></canvas>

    <section id="hud" class="hidden">
      <div class="top">
        <div class="third popups" id="popups"></div>
        <div class="third state">
          <div id="score">000000</div>
          <div class="power"><div></div></div>
        </div>
        <div class="third combo"><span id="mult">x1</span></div>
      </div>
      <button id="pause-button" aria-label="Pause"><span>Pause</span></button>
      <div id="start-prompt" class="hidden">Tap to start</div>
      <button id="boost-button" class="hidden" aria-label="Boost"><span>Boost</span></button>
      <div id="fps" class="hidden"></div>
    </section>

    <section id="menu">
      <div class="panel" data-panel="main">
        <div class="logo">SNAKES</div>
        <button data-go="start">Start Game</button>
        <button data-go="options">Option</button>
      </div>
      <div class="panel hidden" data-panel="start">
        <h2>Start Game</h2>
        <button id="continue">Continue</button>
        <button data-go="new">Select Level</button>
        <div class="space"></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="new">
        <h2>Select Level</h2>
        <select id="level-select" aria-label="Level"></select>
        <div class="level-card">
          <canvas id="level-preview" width="120" height="120"></canvas>
          <div><div id="level-name">Level 0</div><div id="level-kind">Initial</div></div>
        </div>
        <div class="label" id="level-count"></div>
        <button id="select-level">Select</button>
        <div class="space"></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="options">
        <h2>Options</h2>
        <div class="settings">
          <label for="music-volume">Music</label>
          <input type="range" id="music-volume" min="0" max="1" step="0.01">
          <label for="sfx-volume">Sound</label>
          <input type="range" id="sfx-volume" min="0" max="1" step="0.01">
          <label for="view-distance">View distance <span id="view-value">120%</span></label>
          <input type="range" id="view-distance" min="1" max="1.5" step="0.01">
          <span>Graphics</span>
          <div class="row" data-setting="graphics"><button data-value="modern">Modern</button><button data-value="classic">Classic</button></div>
          <label for="item-glow">Item glow <span id="glow-value">75%</span></label>
          <input type="range" id="item-glow" min="0.2" max="1" step="0.01">
          <label for="item-color">Item color <span id="color-value">0%</span></label>
          <input type="range" id="item-color" min="0" max="1" step="0.01">
          <span>Color grading</span>
          <div class="row" data-setting="grading"><button data-value="on">On</button><button data-value="off">Off</button></div>
          <span>Score pop-ups</span>
          <div class="row" data-setting="popups"><button data-value="on">On</button><button data-value="off">Off</button></div>
          <span>Boost button</span>
          <div class="row" data-setting="boostButton"><button data-value="on">On</button><button data-value="off">Off</button></div>
          <span>Frame rate</span>
          <div class="row" data-setting="frameRate"><button data-value="auto">Auto</button><button data-value="60">60</button><button data-value="max">Max</button></div>
          <span>FPS counter</span>
          <div class="row" data-setting="fpsCounter"><button data-value="on">On</button><button data-value="off">Off</button></div>
          <span>Score</span>
          <div class="row" data-setting="scoreShown"><button data-value="on">On</button><button data-value="off">Off</button></div>
        </div>
        <div class="space"></div>
        <button id="reset-data">Reset All Data</button>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="pause">
        <h2>Pause</h2>
        <button id="resume">Continue</button>
        <button id="restart-level">Restart Level</button>
        <button data-go="options">Options</button>
        <div class="space"></div>
        <button id="to-menu">Main Menu</button>
      </div>
      <div class="panel hidden" data-panel="complete">
        <h2>Level Complete</h2>
        <div class="label" id="complete-level"></div>
        <div class="results">
          <span>Time</span><span id="complete-time"></span>
          <span>Total Score</span><span id="complete-score"></span>
        </div>
        <button id="next-map">Next Level</button>
        <button id="stay-map">Stay on This Level</button>
        <button id="replay-map">Replay Level</button>
        <div class="space"></div>
        <button id="complete-to-menu">Main Menu</button>
      </div>
      <div class="panel hidden" data-panel="lost">
        <h2>Game Over</h2>
        <div class="label" id="lost-stage"></div>
        <button id="retry-level">Restart Level</button>
        <div class="space"></div>
        <button id="lost-to-menu">Main Menu</button>
      </div>
    </section>

    <div id="fade"></div>
  </main>
  <script src="vendor/three.min.js"></script>
  <script src="nsnakes-data.js?v=8"></script>
  <script src="levels.js?v=80"></script>
  <script src="game.js?v=74"></script>
</body>
</html>
