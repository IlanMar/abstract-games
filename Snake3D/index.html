<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Snakes 3D</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Snakes 3D"></canvas>

    <section id="hud" class="hidden">
      <div class="top">
        <div class="third popups" id="popups"><div id="stage-indicator"></div></div>
        <div class="third state">
          <div id="score">000000</div>
          <div class="power"><div></div></div>
        </div>
        <div class="third combo"><span id="mult">x1</span></div>
      </div>
      <button id="pause-button" aria-label="Pause"><span>Pause</span></button>
      <div id="start-prompt" class="hidden">Tap to start</div>
    </section>

    <section id="menu">
      <div class="panel" data-panel="main">
        <div class="logo">SNAKES</div>
        <button data-go="start">Start Game</button>
        <button data-go="top">Top Score</button>
        <button data-go="options">Option</button>
      </div>
      <div class="panel hidden" data-panel="start">
        <h2>Start Game</h2>
        <button id="continue">Continue</button>
        <button data-go="new">New Game</button>
        <div class="space"></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="new">
        <h2>New Game</h2>
        <div class="level-card">
          <canvas id="level-preview" width="120" height="120"></canvas>
          <div><div id="level-name">Level 0</div><div id="level-kind">Initial</div></div>
        </div>
        <label class="label" for="stage-select">Stage</label>
        <select id="stage-select" aria-label="Stage"></select>
        <button id="select-level">Select</button>
        <div class="space"></div>
        <div class="row"><button id="prev-level">Previous</button><button id="next-level">Next</button></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="top">
        <h2>Top Score</h2>
        <div class="stats" id="stats"></div>
        <div class="space"></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="options">
        <h2>Options</h2>
        <div class="label">Music</div>
        <input type="range" id="music-volume" min="0" max="1" step="0.01" aria-label="Music volume">
        <div class="label">Sound</div>
        <input type="range" id="sfx-volume" min="0" max="1" step="0.01" aria-label="Sound volume">
        <div class="label">Color grading</div>
        <div class="row"><button data-grading="on">On</button><button data-grading="off">Off</button></div>
        <div class="space"></div>
        <button data-back>Back</button>
      </div>
      <div class="panel hidden" data-panel="pause">
        <h2>Pause</h2>
        <button id="resume">Continue</button>
        <button data-go="options">Options</button>
        <div class="space"></div>
        <button id="to-menu">Main Menu</button>
      </div>
    </section>

    <div id="fade"></div>
    <div id="loading" class="hidden">Loading...</div>
  </main>
  <script src="vendor/three.min.js"></script>
  <script src="nsnakes-data.js?v=8"></script>
  <script src="game.js?v=14"></script>
</body>
</html>
