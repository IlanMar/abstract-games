<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Abstract Trader</title>
<style>
  /* touch-action не наследуется, поэтому ставим всем: убирает зум по двойному тапу */
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation }
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#232a35;
    --fg:#e6edf3; --dim:#8b949e; --up:#2ea043; --down:#e5534b;
    color-scheme: dark;
  }
  body {
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%;
  }
  header { padding: 10px 14px; border-bottom: 1px solid var(--line) }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
  .row + .row { margin-top: 4px }
  .price { font-size: 26px; font-weight: 600 }
  .hint { font-size: 11px; color: var(--dim) }
  select {
    max-width: 62%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--fg); font: 600 13px/1 inherit; cursor: pointer;
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; font-size: 12px; color: var(--dim) }
  .stats b { display: block; font-size: 15px; font-weight: 600; color: var(--fg) }
  .num, .price, .stats b { font-variant-numeric: tabular-nums }
  main { position: relative; flex: 1; min-height: 0 }
  canvas { display: block; width: 100%; height: 100% }
  footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px }
  button {
    padding: 18px 0; border: 0; border-radius: 12px; color: #fff; cursor: pointer;
    font: 600 17px/1 inherit; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .3 }
  button:active:not(:disabled) { transform: translateY(1px) }
  #buy { background: var(--up) } #sell { background: var(--down) }
  #over {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(14,17,22,.92);
  }
  #over.show { display: flex }
  #over h1 { font-size: 22px; color: var(--down) }
  #restart { background: var(--panel); border: 1px solid var(--line); padding: 14px 26px }
</style>
</head>
<body>

<header>
  <div class="row">
    <select id="src"></select>
    <span class="num" id="chg">0.00%</span>
  </div>
  <div class="row">
    <span class="price" id="price">$10.00</span>
    <span class="hint" id="hint" title="Игра идёт на доходностях бумаги: старт всегда $10, а форма графика — настоящая"></span>
  </div>
  <div class="stats">
    <div>Кэш<b id="cash">$1000</b></div>
    <div>Акции<b id="shares">0</b></div>
    <div>Капитал<b id="equity">$1000</b></div>
    <div>Рекорд<b id="best">&mdash;</b></div>
  </div>
</header>

<main>
  <canvas id="c"></canvas>
  <div id="over">
    <h1 id="verdict">Банкрот</h1>
    <p id="result"></p>
    <button id="restart">Начать заново</button>
  </div>
</main>

<footer>
  <button id="buy">Купить 10</button>
  <button id="sell">Продать 10</button>
</footer>

<script src="data/quotes.js"></script>
<script>
'use strict';

// --- правила игры ---------------------------------------------------------
const TICK   = 100;    // мс на одну котировку
const POINTS = 600;    // точек в окне графика (= 60 секунд истории)
const LOT    = 10;     // акций в одной сделке
const START  = { price: 10, cash: 1000, shares: 0 };
const RUIN   = 100;    // капитал, ниже которого — банкротство

// --- модель случайного рынка ----------------------------------------------
const SIGMA = 0.003;   // волатильность за тик (в лог-доходности)
const PULL  = 0.0008;  // возврат к справедливой цене
const AXIS  = 54;      // ширина шкалы цен, px

// --- источники котировок --------------------------------------------------
// SIM — генератор; остальное — часовые бары реальных бумаг из data/quotes.js.
// Играем не абсолютной ценой, а доходностями бумаги, поэтому старт всегда $10.
const SIM = 'SIM';
const QUOTES = window.QUOTES || {};

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const hist = new Float32Array(POINTS);   // кольцевой буфер котировок

let head = 0, price, cash, shares, avg, peak, dead;
let drift, regimeEnd, tickAt;
let srcKey = SIM, series = null, idx = 0;   // series = null — играем на симуляции
let W = 0, H = 0, PW = 0, upFill, downFill;

// --- результат в localStorage ---------------------------------------------
const KEY = 'abstract-trader';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
if (!saved.best || typeof saved.best !== 'object') saved.best = {};   // рекорд — свой у каждой бумаги
function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

// --- рынок ----------------------------------------------------------------
let spare = null;
function gauss() {                     // Бокс—Мюллер, вторую величину кэшируем
  if (spare !== null) { const v = spare; spare = null; return v; }
  const r = Math.sqrt(-2 * Math.log(1 - Math.random())), a = 2 * Math.PI * Math.random();
  spare = r * Math.sin(a);
  return r * Math.cos(a);
}

function newRegime(now) {              // новый тренд длиной 2...30 секунд
  drift = (Math.random() * 2 - 1) * 0.0005;
  regimeEnd = now + 2000 + Math.random() * 28000;
}

const equity = () => cash + shares * price;

function simReturn(now) {              // тренд + возврат к среднему + случайный шок
  if (now >= regimeEnd) newRegime(now);
  return drift + PULL * Math.log(START.price / price) + SIGMA * gauss();
}

function realReturn() {                // следующий бар реальной истории
  const prev = series[idx];
  idx = (idx + 1) % series.length;
  return idx ? Math.log(series[idx] / prev) : 0;   // на склейке цикла — без разрыва
}

function step(now) {
  price *= Math.exp(series ? realReturn() : simReturn(now));
  hist[head] = price;
  head = (head + 1) % POINTS;

  const eq = equity();
  if (eq > peak) peak = eq;
  if (eq < RUIN || (!shares && cash < LOT * price)) gameOver();
}

// --- сделки ---------------------------------------------------------------
function buy() {
  const cost = LOT * price;
  if (dead || cash < cost) return;
  avg = (avg * shares + cost) / (shares + LOT);
  cash -= cost; shares += LOT;
  hud();
}

function sell() {
  if (dead || shares < LOT) return;
  cash += LOT * price; shares -= LOT;
  hud();
}

// --- партия ---------------------------------------------------------------
function reset() {
  price = START.price; cash = START.cash; shares = START.shares; avg = START.price;
  series = QUOTES[srcKey] ? QUOTES[srcKey].c : null;
  if (series) {
    // случайный отрезок реальной истории; окно перед ним — уже готовая предыстория
    idx = POINTS + Math.floor(Math.random() * (series.length - POINTS));
    const base = series[idx];
    for (let i = 0; i < POINTS; i++) hist[i] = price * series[idx - POINTS + 1 + i] / base;
  } else {
    // предыстория: идём от текущей цены назад, чтобы график сразу выглядел живым
    for (let i = POINTS - 1, p = price; i >= 0; i--) {
      hist[i] = p;
      p *= Math.exp(SIGMA * gauss() - PULL * Math.log(START.price / p));
    }
  }
  head = 0;
  peak = equity(); dead = false;
  tickAt = performance.now(); newRegime(tickAt);
  $('hint').textContent = series ? 'реальная история · 1 час на тик' : 'случайный рынок';
  $('over').classList.remove('show');
  hud();
}

function gameOver() {
  dead = true;
  saved.last = Math.round(peak);
  saved.best[srcKey] = Math.max(saved.best[srcKey] || 0, saved.last);
  persist();
  $('verdict').textContent = equity() < RUIN ? 'Банкрот' : 'Не на что торговать';
  $('result').textContent = 'Результат: $' + saved.last + ' · Рекорд: $' + saved.best[srcKey];
  $('over').classList.add('show');
  hud();
}

// --- интерфейс ------------------------------------------------------------
function hud() {
  const eq = equity(), chg = (price / START.price - 1) * 100;
  $('price').textContent = '$' + price.toFixed(2);
  $('chg').textContent = (chg < 0 ? '' : '+') + chg.toFixed(2) + '%';
  $('chg').style.color = chg < 0 ? 'var(--down)' : 'var(--up)';
  $('cash').textContent = '$' + Math.round(cash);
  $('shares').textContent = shares;
  $('equity').textContent = '$' + Math.round(eq);
  $('equity').style.color = eq < START.cash + START.shares * START.price ? 'var(--down)' : 'var(--up)';
  $('best').textContent = saved.best[srcKey] ? '$' + saved.best[srcKey] : '—';
  $('buy').disabled = dead || cash < LOT * price;
  $('sell').disabled = dead || shares < LOT;
}

function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height; PW = W - AXIS;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  upFill = fade('#2ea043'); downFill = fade('#e5534b');
}

function fade(color) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, color + '40');
  g.addColorStop(1, color + '00');
  return g;
}

// f — доля прошедшего тика: за счёт неё график едет плавно, а не рывками
function draw(f) {
  ctx.clearRect(0, 0, W, H);

  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < POINTS; i++) { const v = hist[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  const pad = (hi - lo) * 0.12 + 0.02;
  lo -= pad; hi += pad;

  const k = H / (hi - lo);
  const y = v => (hi - v) * k;
  const dx = PW / (POINTS - 2);
  const x0 = PW - dx * (POINTS - f);

  ctx.font = '11px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, yy = Math.round(y(v)) + .5;
    ctx.strokeStyle = '#232a35';
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(PW, yy); ctx.stroke();
    ctx.fillStyle = '#8b949e';
    ctx.fillText(v.toFixed(2), PW + 6, Math.min(Math.max(yy, 8), H - 8));
  }

  const up = price >= hist[head];               // hist[head] — самая старая точка
  ctx.beginPath();
  ctx.moveTo(x0, y(hist[head]));
  for (let i = 1; i < POINTS; i++) ctx.lineTo(x0 + dx * i, y(hist[(head + i) % POINTS]));
  ctx.strokeStyle = up ? '#2ea043' : '#e5534b';
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.lineTo(x0 + dx * (POINTS - 1), H); ctx.lineTo(x0, H); ctx.closePath();
  ctx.fillStyle = up ? upFill : downFill;
  ctx.fill();

  if (shares) {                                  // средняя цена позиции
    const yy = Math.round(y(avg)) + .5;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#8b949e';
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(PW, yy); ctx.stroke();
    ctx.setLineDash([]);
  }

  const yp = Math.min(Math.max(y(price), 9), H - 9);   // ценник у правого края
  ctx.fillStyle = up ? '#2ea043' : '#e5534b';
  ctx.fillRect(PW, yp - 9, W - PW, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText(price.toFixed(2), PW + 6, yp);
}

function frame(now) {
  if (!dead) {
    if (now - tickAt > 1000) tickAt = now - TICK;   // вкладка была свёрнута — не догоняем
    let ticks = 0;
    while (now - tickAt >= TICK && !dead) { tickAt += TICK; step(now); ticks++; }
    if (ticks) hud();
  }
  draw(dead ? 1 : (now - tickAt) / TICK);
  requestAnimationFrame(frame);
}

// --- выбор бумаги ---------------------------------------------------------
const sel = $('src');
sel.add(new Option('Случайная бумага', SIM));
for (const k in QUOTES) sel.add(new Option(QUOTES[k].name + ' · ' + k, k));
if (saved.src === SIM || QUOTES[saved.src]) srcKey = saved.src;
sel.value = srcKey;
sel.onchange = () => { srcKey = saved.src = sel.value; persist(); reset(); };

$('buy').onclick = buy;
$('sell').onclick = sell;
$('restart').onclick = reset;
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') buy();
  if (e.key === 'ArrowDown') sell();
});
new ResizeObserver(resize).observe(cv);

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
