<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Abstract Cell</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>
<div id="hint">Click anywhere — the cell spits a droplet there and drifts the other way</div>
<div id="over"><span>Absorbed — click to restart</span></div>
<pre id="debug"></pre>

<button id="menuBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="menu">
  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
    <path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<div id="menu" role="dialog" aria-label="Settings" hidden>
  <div class="m-title">Settings</div>

  <label class="m-row" for="s-eject"><span>Droplet mass</span><output id="o-eject"></output></label>
  <input type="range" id="s-eject" min="0.5" max="6" step="0.25">

  <label class="m-row m-switch" for="s-zoom"><span>Camera zoom</span><input type="checkbox" id="s-zoom"></label>

  <div class="m-sep">New world</div>

  <label class="m-row" for="s-enemies"><span>Enemies</span><output id="o-enemies"></output></label>
  <input type="range" id="s-enemies" min="5" max="150" step="1">

  <label class="m-row" for="s-diff"><span>Difficulty</span><output id="o-diff"></output></label>
  <input type="range" id="s-diff" min="0" max="100" step="5">

  <label class="m-row" for="s-map"><span>Map size</span><output id="o-map"></output></label>
  <input type="range" id="s-map" min="600" max="4500" step="100">

  <label class="m-row" for="s-maxe"><span>Max enemy size</span><output id="o-maxe"></output></label>
  <input type="range" id="s-maxe" min="0.5" max="10" step="0.1">

  <div class="m-btns">
    <button type="button" id="b-defaults">Defaults</button>
    <button type="button" id="b-new">New world</button>
  </div>

  <label class="m-row m-switch m-last" for="s-debug"><span>Show FPS</span><input type="checkbox" id="s-debug"></label>
</div>

<script src="game.js"></script>
</body>
</html>
